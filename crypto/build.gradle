plugins {
    id 'java'
}

version '1.0.0'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    api project(":common")

    compileOnly("com.diffblue.cover:cover-annotations:1.6.0")
    testImplementation("com.diffblue.cover:cover-annotations:1.6.0")
    testImplementation "org.springframework:spring-test:5.3.18"
}

jacocoTestReport {
    reports {
        xml.enabled = true
        html.enabled = true
    }
    def diffblueOnly = providers.gradleProperty("diffblueOnly")
    if (!diffblueOnly.present) {
        // Include coverage from both this & framework modules
        getExecutionData()
            .setFrom(
                fileTree('./build/jacoco').include("**.exec"), 
                fileTree('../framework/build/jacoco').include("**.exec"))
    }
    afterEvaluate {
        classDirectories.from = classDirectories.files.collect {
            fileTree(dir: it,)
        }
    }
}
